name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# TODO(supply-chain): pin the three actions below to full commit SHAs. They are floating
# tags today, so a repointed or compromised tag would execute in a job that holds
# `packages: write`. Resolve and apply with:
#
#   for a in actions/checkout actions/setup-node pnpm/action-setup; do
#     gh api "repos/$a/git/ref/tags/v4" --jq "\"$a  \(.object.sha)\""
#   done
#
# then rewrite each `uses:` as `owner/repo@<sha> # v4`. Left as tags rather than guessed
# SHAs because an incorrect digest fails the job outright.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@marksyncorg'

      - run: pnpm install --frozen-lockfile

      # Quality gate. The test suite is the only thing guarding the crypto, merge and
      # validation logic, so a tag must not publish past a red build.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Publishes the prebuilt tarball (dist + openapi). Consumers install from the
      # registry without running build scripts.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
