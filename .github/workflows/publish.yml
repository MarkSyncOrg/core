name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Every action below is pinned to a full commit SHA, not a tag. This job holds
# `packages: write`, so a repointed or compromised tag would publish under our scope. A
# tag is a mutable pointer; a digest is not. The trailing comment records which release
# each digest was, since the digest itself says nothing about the version — re-resolve it
# (`git ls-remote --tags https://github.com/<owner>/<repo> 'v4^{}'`) when bumping, rather
# than editing the comment to match a version you have not repinned.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@marksyncorg'

      - run: pnpm install --frozen-lockfile

      # Quality gate. The test suite is the only thing guarding the crypto, merge and
      # validation logic, so a tag must not publish past a red build.
      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

      # Publishes the prebuilt tarball (dist + openapi). Consumers install from the
      # registry without running build scripts.
      - run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
