# pnpm 11 reads settings from here rather than the "pnpm" field in package.json.
#
# Every advisory below is build-time only: these packages reach the tree through
# devDependencies (openapi-typescript, vitest) and never ship, since `files` publishes
# only dist + openapi. Pinned anyway so `pnpm audit` stays quiet and a future *runtime*
# advisory is not lost among known-benign noise.
# js-yaml and nanoid are held to their current major on purpose: an open range would let
# pnpm resolve the newest release of any major, and js-yaml 5 removed the `types.merge`
# export that @redocly/openapi-core reads off the v4 default — which breaks `pnpm gen:api`
# outright. A caret keeps the fix without the break.
overrides:
  brace-expansion: '>=2.1.3'  # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg (DoS)
  postcss: '>=8.5.18'         # GHSA-7fh5-64p2-3v2j (source-map path traversal)
  js-yaml: ^4.3.1             # GHSA-h67p-54hq-rp68 + two later merge-key/omap DoS advisories
  nanoid: ^3.3.18             # GHSA-2v37-7h3g-55p8 (custom generators can loop forever)

# The js-yaml entry above replaces a "deliberately not overridden" note that no longer
# holds. When it was written the only fixed release was in 5.x, so pinning meant choosing
# between the advisory and a working `pnpm gen:api`. 4.2.0, 4.3.0 and 4.3.1 have shipped
# since, and 4.3.1 clears all three advisories inside the major the build needs.
